<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha</title>
  <link rel="stylesheet" href="../static/css/resetar-senha.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <h1>Criar nova senha</h1>
      <p>Digite sua nova senha abaixo. Escolha uma combinação forte e segura.</p>
    </div>

    <form>
      <div class="form-group">
        <label for="senha">Nova senha</label>
        <div class="input-wrapper">
          <input type="password" id="senha" placeholder="••••••••" required>
          <i data-lucide="lock" style="width: 20px; height: 20px; order: -1;"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmar-senha">Repetir senha</label>
        <div class="input-wrapper">
          <input type="password" id="confirmar-senha" placeholder="••••••••" required>
          <i data-lucide="lock" style="width: 20px; height: 20px; order: -1;"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Redefinir Senha
      </button>
    </form>
  </div>

  <script>
    lucide.createIcons();
  </script>
  <script src="../static/javascript/config.js"></script>
  <script src="../static/javascript/resetar-senha.js"></script>
</body>
</html>
